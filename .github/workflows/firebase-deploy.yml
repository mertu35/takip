name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build
        env:
          # NOT: Firebase web API anahtarı gizli bir bilgi DEĞİLDİR; tasarımı
          # gereği her istemci paketinin içinde bulunur. Güvenlik Firestore
          # kurallarından gelir, anahtarı saklamaktan değil.
          #
          # Eskiden bu değer bir GitHub secret'ından geliyordu. Secret tanımlı
          # olmadığı için boş kalıyor, uygulama sessizce "yerel simülasyon"
          # (localStorage) moduna düşüyordu: canlı sitede girilen tüm veriler
          # buluta değil, kullanıcının tarayıcısına yazılıyordu. Aşağıdaki 5
          # alan zaten sabit yazıldığı için anahtarı da sabitliyoruz.
          VITE_FIREBASE_API_KEY: "AIzaSyDbtwV8JVqqiC7fTRaHmOoCEjWn2sYYUP8"
          VITE_FIREBASE_AUTH_DOMAIN: "ozkon-celik-takip.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "ozkon-celik-takip"
          VITE_FIREBASE_STORAGE_BUCKET: "ozkon-celik-takip.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "351331034390"
          VITE_FIREBASE_APP_ID: "1:351331034390:web:5651cab58d7e3b87329c37"

      # Emniyet kemeri: paketin içinde gerçekten bir API anahtarı var mı?
      # Yoksa uygulama mock moda düşer ve veriler buluta yazılmaz. Böyle bir
      # sürümü yayınlamaktansa derlemeyi durdurmak daha iyidir.
      - name: Verify Firebase config is embedded
        run: |
          if ! grep -rq "AIzaSy" dist/assets/*.js; then
            echo "HATA: Derlenen pakette Firebase API anahtari yok."
            echo "Uygulama yerel simulasyon (localStorage) modunda calisirdi - deploy durduruldu."
            exit 1
          fi
          echo "OK: Firebase yapilandirmasi pakete gomulu."

      # NOT: Eskiden burada yalnizca "--only hosting" vardi. Bu yuzden
      # firestore.rules ve firestore.indexes.json repoda guncelleniyor ama
      # canliya hic gitmiyordu; ancak elle "firebase deploy" calistirildiginda
      # guncelleniyorlardi. Artik kod, kurallar ve index'ler birlikte yayina
      # gidiyor; repo ile canli arasinda kayma olusamaz.
      #
      # "firestore" hedefi hem rules hem indexes'i kapsar. Ekleme aninda
      # canlidaki 3 index dosyadakiyle birebir esitti, yani silinecek index
      # yoktu. Ileride konsoldan ELLE index olusturursan onu bu dosyaya da
      # eklemeyi unutma; yoksa deploy onu silmeye calisabilir.
      - name: Deploy to Firebase Hosting, Rules & Indexes
        uses: w9jds/firebase-action@v2.2.0
        with:
          args: deploy --only hosting,firestore
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
